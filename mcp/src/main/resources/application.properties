quarkus.log.level=INFO
quarkus.mcp.server.server-info.name=camel-kit-knowledge
quarkus.mcp.server.server-info.version=1.0.0

# Disable banner on stdout — stdio MCP requires clean JSON-RPC on stdout
quarkus.banner.enabled=false

# HTTP disabled by default — stdio is the primary transport.
# To enable SSE, pass -Dquarkus.http.port=9090
quarkus.http.port=-1

# Build uber-jar so jbang can run it as a single artifact
quarkus.package.jar.type=uber-jar

# Knowledge index resolution (manifest published as a GitHub Release asset).
# Defaults resolve the latest release into ~/.camel-kit/knowledge-index and open it in place.
# knowledge.index.path=/path/to/knowledge-index         # local dir, no download (dev / air-gapped)
# knowledge.index.url=https://github.com/luigidemasi/camel-kit-knowledge/releases/latest/download/index.json
# knowledge.index.cache-dir=${user.home}/.camel-kit/knowledge-index
