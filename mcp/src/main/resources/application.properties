quarkus.log.level=INFO
quarkus.mcp.server.server-info.name=camel-kit-knowledge
quarkus.mcp.server.server-info.version=1.0.0

# Disable banner on stdout — stdio MCP requires clean JSON-RPC on stdout
quarkus.banner.enabled=false

# HTTP disabled by default — stdio is the primary transport.
# To enable SSE, pass -Dquarkus.http.port=9090
quarkus.http.port=-1

# Build uber-jar so jbang can run it as a single artifact
quarkus.package.jar.type=uber-jar

# Knowledge index artifact resolution
knowledge.index.group-id=io.github.luigidemasi
knowledge.index.artifact-id=camel-kit-knowledge-index
# knowledge.index.version=202603131454
# knowledge.index.repositories=https://repo1.maven.org/maven2

# OpenTelemetry — disabled by default for zero overhead in normal usage.
# Enable at runtime via QUARKUS_OTEL_ENABLED=true env var for perf testing.
quarkus.otel.enabled=false
quarkus.otel.exporter.otlp.endpoint=http://localhost:4318
quarkus.otel.service.name=camel-kit-knowledge-mcp
